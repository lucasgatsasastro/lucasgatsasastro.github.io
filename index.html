<div class="post-list">
  {% for post in paginator.posts %}
  <article class="post-entry">
    <p class="post-date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time></p>
    <h2><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title | escape }}</a></h2>
    <p class="excerpt">{{ post.excerpt | strip_html | strip_newlines | truncatewords: 45 }}</p>
    <a class="more" href="{{ post.url | prepend: site.baseurl }}">Read more →</a>
  </article>
  {% endfor %}
</div>
