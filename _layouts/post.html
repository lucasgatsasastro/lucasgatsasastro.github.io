---
layout: default
---
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "url": "{{ site.url }}{{ page.url }}",
    "name": {{ page.title | jsonify }},
    "headline": "{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}",
    "description": "{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 140 }}{% else %}{{ site.description }}{% endif %}",
    "keywords": "Lucas Gatsas, Gatsas, Astro + Solar Photographer, tse262728.com, tse262728",
    "datePublished": {{ page.date | jsonify }},
    "dateModified": {{ page.last_modified_at | default: page.date | jsonify }},
    "contentUrl": "{{ site.url }}{{ page.image | default: site.img_url }}",
    "sameAs": [
      "https://www.instagram.com/lucasgatsas",
      "https://youtube.com/@lucasgatsasastro",
      "https://x.com/lucasgatsas",
      "https://www.threads.net/@lucasgatsas",
      "https://vsco.co/lucasgatsas/gallery"
    ],
    "author": {
      "@type": "Person",
      "name": {{ site.author.name | jsonify }},
      "givenName": {{ site.author.givenName | jsonify }},
      "familyName": {{ site.author.familyName | jsonify }},
      "url": "{{ site.url }}{{ page.image | default: site.img_url }}"
    },
    "jobTitle": "Astro und Solar Photographer",
    "worksFor": {
      "@type": "Organization",
      "name": "Swiss Solar Observatory Society",
      "url": "https://lucasgatsas.xyz"
    },
    "publisher": {
      "@type": "Organization",
      "name": {{ site.title | jsonify }},
      "url": "{{ site.url }}",
      "logo": {
        "@type": "ImageObject",
        "width": 32,
        "height": 32,
        "url": "{{ site.url }}/icon/favicon.ico"
      }
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}"
    },
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.url }}{{ page.image | default: site.img_url }}",
      "creditText": "Lucas Gatsas Media",
      "license": "https://lucasgatsas.xyz/about",
      "acquireLicensePage": "https://lucasgatsas.xyz/about",
        "creator": {
          "@type": "Person",
          "name": "Lucas Gatsas",
          "url": "{{ site.url }}"
        },
      "copyrightNotice": "Lucas Gatsas"
    }
  }
  </script>

<article>
  <header class="post-header">
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
  </header>

  {% if page.image %}
  <figure class="post-hero lb">
    <button type="button" class="lb-btn" aria-label="View image">
      <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title | escape }}" fetchpriority="high">
    </button>
  </figure>
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>

  {% if page.tags.size >= 1 %}
  <p class="post-tags">
    {% for tag in page.tags %}<a href="{{ site.baseurl }}/tag/{{ tag }}">{{ tag }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
  </p>
  {% endif %}

  <p class="back"><a href="{{ site.baseurl }}/">← All posts</a></p>
</article>
