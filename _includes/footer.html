<!-- begin footer -->
<footer class="foot">
  © <span id="year">{{ site.time | date: '%Y' }}</span> by {{ site.author.name | default: site.title }}
  {% for page in site.pages %}{% unless page.name == 'tags.html' or page.name == '404.html' or page.name == 'index.html' %}{% if page.title %} · <a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>{% endif %}{% endunless %}{% endfor %}
</footer>
<!-- end footer -->
